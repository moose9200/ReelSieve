<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BNBsieve{% endblock %} · BNBsieve by Braivex</title>
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("lr-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <svg width="26" height="26" viewBox="0 0 100 100" role="img" aria-label="BNBsieve"><circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="50" cy="50" r="14" fill="currentColor"/><circle cx="43" cy="43" r="4" fill="var(--surface)"/></svg>
      <span class="brand-word">BNBsieve</span>
      <span class="brand-suffix">by Braivex</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/"{% if request and request.url.path == "/" %} aria-current="page"{% endif %}>New reel</a>
      <a href="/reels"{% if request and request.url.path == "/reels" %} aria-current="page"{% endif %}>Reels</a>
      <a href="/settings"{% if request and request.url.path == "/settings" %} aria-current="page"{% endif %}>Settings</a>
      {% if request and request.state.user %}<a href="/logout" class="nav-user" title="Signed in as {{ request.state.user }}">Log out</a>{% endif %}
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark theme" title="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    BNBsieve is a Braivex product · <a href="https://braivex.com" rel="noopener">braivex.com</a>
  </footer>

  <script src="/static/app.js" defer></script>
</body>
</html>
